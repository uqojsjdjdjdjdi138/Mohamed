<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>محلل الحركة</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--fg:#111;--card:#eef1f4;--ac:#0a7d6a;--y:#b58900;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#eee;--card:#222;--ac:#3cc9b0;--y:#ffd400;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111;--fg:#eee;--card:#222;--ac:#3cc9b0;--y:#ffd400;color-scheme:dark}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:720px;margin-inline:auto}
h1{font-size:19px;margin:4px 0 10px}
.card{background:var(--card);border-radius:12px;padding:10px;margin-bottom:10px}
button,select,.btn{font:inherit;padding:10px 12px;border-radius:10px;border:0;background:var(--ac);color:#fff;margin:3px;display:inline-block;cursor:pointer}
select,input[type=number]{background:var(--bg);color:var(--fg);border:1px solid var(--ac);font:inherit;border-radius:8px;padding:6px}
input[type=number]{width:64px;direction:ltr}
button:disabled{opacity:.4}
canvas{width:100%;border-radius:10px;background:#000;display:block}
input[type=file]{display:none}video{position:absolute;top:0;left:0;width:2px;height:2px;opacity:.01;pointer-events:none}
input[type=range]{width:100%}
textarea{width:100%;height:110px;direction:ltr;font-size:12px;background:var(--bg);color:var(--fg);border-radius:8px}
#st{font-size:14px;min-height:20px}
.big{font-size:15px;font-weight:600;direction:ltr;text-align:center;margin:4px 0}
#ban{background:var(--y);color:#000;border-radius:8px;padding:6px 8px;margin:6px 0;font-weight:600;min-height:22px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:4px;text-align:center}
.sum div{background:var(--bg);border-right:6px solid var(--y);margin:4px 0;padding:6px;border-radius:6px;font-size:14px}
</style></head><body>
<h1>محلل الحركة والزوايا</h1>
<div class="card">
<label class="btn" for="f">📁 اختيار فيديو</label><label class="btn" for="rec">🎥 تصوير فيديو</label>
<input type="file" id="f" accept="video/*"><input type="file" id="rec" accept="video/*" capture="environment">
<div><label>فريمات/ث: <select id="fps"><option>24</option><option selected>30</option><option>60</option></select></label>
<label>تحليل كل: <select id="step"><option value="1">فريم</option><option value="2">2</option><option value="3">3</option></select></label></div>
<button id="go" disabled>ابدأ التحليل</button>
<div id="st">استنى تحميل النموذج...</div>
<progress id="pg" value="0" max="1" style="width:100%"></progress>
</div>
<div class="card">
<div id="ban">—</div>
<canvas id="c" width="640" height="360"></canvas>
<div class="big" id="rd">—</div>
<canvas id="tl" height="26" style="height:26px;margin:4px 0"></canvas>
<input type="range" id="sl" min="0" max="0" value="0" disabled>
<button id="pv" disabled>◀</button><button id="pl" disabled>▶ تشغيل</button><button id="nx" disabled>▶</button>
</div>
<div class="card"><b>حدود الزوايا (الخارج عنها يظهر أصفر)</b>
<table id="rt"></table><button id="ap" disabled>تطبيق الحدود</button></div>
<div class="card"><b>ملخص الأخطاء</b><div class="sum" id="sm">—</div></div>
<div class="card"><b>البيانات (CSV)</b><textarea id="csv" readonly></textarea><button id="cp" disabled>نسخ البيانات</button></div>
<video id="v" muted playsinline preload="auto"></video>
<script>
const $=id=>document.getElementById(id);
const vid=$('v'),cv=$('c'),ctx=cv.getContext('2d'),tl=$('tl'),tc=tl.getContext('2d');
let lm=null,data=[],cur=0,playing=false;
const MV='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task';
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
const ANG=[['re','الكوع الأيمن',12,14,16,90,''],['le','الكوع الأيسر',11,13,15,90,''],
['rs','الكتف الأيمن',24,12,14,'',''],['ls','الكتف الأيسر',23,11,13,'',''],
['rk','الركبة اليمنى',24,26,28,120,''],['lk','الركبة اليسرى',23,25,27,120,''],
['rh','الحوض الأيمن',12,24,26,'',''],['lh','الحوض الأيسر',11,23,25,'','']];
const st=t=>$('st').textContent=t;
$('rt').innerHTML='<tr><th></th><th>أقل</th><th>أعلى</th></tr>'+ANG.map(a=>`<tr><td>${a[1]}</td><td><input type="number" id="mn_${a[0]}" value="${a[5]}"></td><td><input type="number" id="mx_${a[0]}" value="${a[6]}"></td></tr>`).join('');

async function init(){
  try{
    const {PoseLandmarker,FilesetResolver}=await import(MV+'/vision_bundle.mjs');
    const fs=await FilesetResolver.forVisionTasks(MV+'/wasm');
    const mk=d=>PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:MODEL,delegate:d},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minTrackingConfidence:.5});
    try{lm=await mk('GPU')}catch(e){lm=await mk('CPU')}
    st('النموذج جاهز. اختار أو صوّر فيديو.');
    if(vid.src)$('go').disabled=false;
  }catch(e){st('تعذر تحميل النموذج (محتاج إنترنت): '+e.message)}
}
function angle(a,b,c){
  const r=Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(a[1]-b[1],a[0]-b[0]);
  const d=Math.abs(r*180/Math.PI);return d>180?360-d:d;
}
function seek(t){return new Promise(res=>{const to=setTimeout(res,4000);vid.onseeked=()=>{clearTimeout(to);res()};vid.currentTime=t})}
function load(e){
  const f=e.target.files[0];if(!f)return;
  data=[];$('go').disabled=true;st('جاري تحميل الفيديو...');
  let tried=0;
  vid.onloadedmetadata=()=>{
    cv.width=vid.videoWidth;cv.height=vid.videoHeight;
    seek(0.001).then(()=>ctx.drawImage(vid,0,0,cv.width,cv.height));
    st('الفيديو جاهز ('+vid.duration.toFixed(1)+' ث)'+(lm?'':' - استنى تحميل النموذج'));$('go').disabled=!lm;
  };
  vid.onerror=()=>{
    if(!tried++){st('بجرب طريقة تانية للتحميل...');const r=new FileReader();r.onload=()=>{vid.src=r.result;vid.load()};r.readAsDataURL(f)}
    else st('الفيديو مش بيفتح (كود '+(vid.error?vid.error.code:'?')+'). غالباً الصيغة مش مدعومة (HEVC/MOV) أو الصفحة بتمنع الملف. جرب تصوّر الفيديو بصيغة MP4/H.264.');
  };
  vid.src=URL.createObjectURL(f);vid.load();
}
$('f').onchange=load;$('rec').onchange=load;

$('go').onclick=async()=>{
  const fps=+$('fps').value,step=+$('step').value,dt=step/fps,n=Math.floor(vid.duration/dt);
  data=[];$('go').disabled=true;playing=false;
  const W=vid.videoWidth,H=vid.videoHeight;
  for(let i=0;i<n;i++){
    const t=i*dt;await seek(t+0.0005);
    const r=lm.detectForVideo(vid,Math.round(t*1000)+i),p=r.landmarks&&r.landmarks[0];
    const row={fr:i*step+1,t:+t.toFixed(3),pts:p||null,a:{},v:{},err:[]};
    if(p)ANG.forEach(([k,,x,y,z])=>{
      const g=q=>[p[q].x*W,p[q].y*H];
      row.a[k]=angle(g(x),g(y),g(z));row.v[k]=Math.min(p[x].visibility,p[y].visibility,p[z].visibility);
    });
    data.push(row);$('pg').value=(i+1)/n;
    if(i%5==0)st('تحليل '+(i+1)+' / '+n);
    if(i%3==0)await new Promise(r=>setTimeout(r));
  }
  // تنعيم خفيف (متوسط 3 فريمات)
  data.forEach((d,i)=>{d.s={};ANG.forEach(([k])=>{
    const vs=[data[i-1],d,data[i+1]].filter(x=>x&&x.a[k]!==undefined).map(x=>x.a[k]);
    if(d.a[k]!==undefined)d.s[k]=+(vs.reduce((a,b)=>a+b,0)/vs.length).toFixed(1);
  })});
  ['sl','pv','pl','nx','cp','ap','go'].forEach(k=>$(k).disabled=false);
  $('sl').max=data.length-1;st('تم تحليل '+data.length+' فريم');
  evalErr();await show(0);
};

function evalErr(){
  const lim={};ANG.forEach(([k])=>{const a=$('mn_'+k).value,b=$('mx_'+k).value;lim[k]=[a===''?null:+a,b===''?null:+b]});
  const cnt={};ANG.forEach(([k])=>cnt[k]=0);let det=0;
  data.forEach(d=>{d.err=[];if(d.pts)det++;
    ANG.forEach(([k])=>{const v=d.s[k];if(v===undefined||d.v[k]<.5)return;
      const [mn,mx]=lim[k];if((mn!==null&&v<mn)||(mx!==null&&v>mx)){d.err.push(k);cnt[k]++}})});
  $('sm').innerHTML=`<div>فريمات تم رصد الجسم فيها: ${det} من ${data.length}</div>`+
   (ANG.filter(a=>cnt[a[0]]).map(a=>{const fr=data.filter(d=>d.err.includes(a[0]));
     return `<div>⚠ ${a[1]}: ${cnt[a[0]]} فريم (${(100*cnt[a[0]]/data.length).toFixed(0)}%) – أول فريم ${fr[0].fr}</div>`}).join('')||'<div>لا توجد أخطاء ضمن الحدود الحالية</div>');
  $('csv').value='Frame,Time_s,'+ANG.map(a=>a[0]+'_deg').join(',')+',Errors\n'+
    data.map(d=>[d.fr,d.t,...ANG.map(a=>d.s[a[0]]??''),d.err.join('|')].join(',')).join('\n');
  drawTL();
}
function drawTL(){
  tl.width=Math.max(300,data.length);tc.clearRect(0,0,tl.width,26);
  const ys=getComputedStyle(document.documentElement).getPropertyValue('--y').trim()||'#ffd400';
  data.forEach((d,i)=>{tc.fillStyle=d.err.length?ys:(d.pts?'#2e8b57':'#555');tc.fillRect(i*tl.width/data.length,0,Math.max(1,tl.width/data.length),26)});
  const x=cur*tl.width/data.length;tc.fillStyle='#fff';tc.fillRect(x,0,3,26);
}
tl.onclick=e=>{if(!data.length)return;playing=false;const r=tl.getBoundingClientRect();show(Math.floor((e.clientX-r.left)/r.width*data.length))};

async function show(i){
  if(!data.length)return;
  i=Math.max(0,Math.min(data.length-1,i));cur=i;$('sl').value=i;
  const d=data[i];await seek(d.t+0.0005);
  ctx.drawImage(vid,0,0,cv.width,cv.height);
  const W=cv.width,H=cv.height,p=d.pts,Y='#ffd400';
  if(p){
    ctx.lineWidth=Math.max(2,W/250);ctx.strokeStyle='#00ff66';
    BONES.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(p[a].x*W,p[a].y*H);ctx.lineTo(p[b].x*W,p[b].y*H);ctx.stroke()});
    ctx.fillStyle='#ff3355';
    [11,12,13,14,15,16,23,24,25,26,27,28].forEach(k=>{ctx.beginPath();ctx.arc(p[k].x*W,p[k].y*H,ctx.lineWidth*1.6,0,7);ctx.fill()});
    ctx.font='bold '+Math.round(W/28)+'px sans-serif';
    ANG.forEach(([k,,,b])=>{if(d.err.includes(k)){
      ctx.fillStyle=Y;ctx.beginPath();ctx.arc(p[b].x*W,p[b].y*H,ctx.lineWidth*3,0,7);ctx.fill();
      ctx.fillText(d.s[k]+'°',p[b].x*W+14,p[b].y*H)}});
  }
  $('ban').textContent=d.err.length?'⚠ '+d.err.map(k=>ANG.find(a=>a[0]==k)[1]+' ('+d.s[k]+'°)').join(' • '):(p?'✓ لا أخطاء':'لم يُرصد الجسم');
  $('rd').textContent='Frame '+d.fr+' | '+d.t+'s | R-elbow '+(d.s.re??'—')+'° L-elbow '+(d.s.le??'—')+'°';
  drawTL();
}
$('sl').oninput=e=>{playing=false;$('pl').textContent='▶ تشغيل';show(+e.target.value)};
$('pv').onclick=()=>show(cur-1);$('nx').onclick=()=>show(cur+1);
$('ap').onclick=()=>{evalErr();show(cur)};
$('pl').onclick=async()=>{
  if(playing){playing=false;$('pl').textContent='▶ تشغيل';return}
  playing=true;$('pl').textContent='⏸ إيقاف';
  while(playing&&cur<data.length-1)await show(cur+1);
  playing=false;$('pl').textContent='▶ تشغيل';
};
$('cp').onclick=async()=>{
  const ta=$('csv');
  try{await navigator.clipboard.writeText(ta.value);st('تم النسخ. الصقه في Excel أو Notes.')}
  catch(e){ta.select();document.execCommand('copy');st('تم النسخ.')}
};
init();
</script></body></html>
